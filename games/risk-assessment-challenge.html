<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk Assessment Challenge | HSE Training</title>
<style>
:root{--red:#DA251D;--red-dark:#B82720;--orange:#E05724;--green:#2f7d4a;--yellow:#d99a00;--blue:#245b8f;--ink:#2f3336;--muted:#6d7479;--soft:#f5f6f7;--line:#dfe3e6;--warm:#f1eee9}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef0f2}button{font:inherit;cursor:pointer}
.app{max-width:1250px;margin:auto;padding:20px}.topbar{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:0 4px 18px #0000000a}
.brand h1{margin:0;font-size:25px}.brand p{margin:5px 0 0;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);text-align:center;min-width:95px}.stat b{display:block;font-size:18px}.stat small{color:var(--muted)}
.progress-wrap{margin:15px 0}.progress{height:8px;background:#ddd;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--red);width:0;transition:.3s}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;margin-top:18px}.nav,.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 4px 18px #00000008}.nav{padding:14px;height:max-content}.nav h3{margin:5px 7px 12px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.scen-btn{width:100%;border:0;background:transparent;text-align:left;padding:11px 10px;border-radius:9px;margin-bottom:4px;color:var(--ink)}.scen-btn:hover{background:var(--soft)}.scen-btn.active{background:#fbe9e8;color:var(--red-dark);font-weight:bold}.scen-btn.done::after{content:" ✓";color:var(--green)}
.main{display:flex;flex-direction:column;gap:16px}.card{padding:22px}.scenario{border-left:5px solid var(--red)}.scenario h2{margin:0 0 8px}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#fbe9e8;color:var(--red-dark);font-size:12px;font-weight:bold;margin-bottom:10px}.scenario p{line-height:1.65;margin:8px 0 0}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.stage-head h2{margin:0}.stage-count{color:var(--muted);font-size:13px}.instructions{color:var(--muted);margin-top:6px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.option{border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px;text-align:left;transition:.15s}.option:hover{border-color:#aaa;transform:translateY(-1px)}.option.selected{border-color:var(--blue);background:#eef5fb}.option small{display:block;color:var(--muted);margin-top:4px}
.action-row{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:bold}.primary{background:var(--red);color:#fff}.primary:hover{background:var(--red-dark)}.secondary{background:var(--soft);border:1px solid var(--line)}
.feedback{margin-top:14px;padding:12px;border-radius:9px;display:none}.feedback.show{display:block}.feedback.good{background:#edf8f1;color:#245d39}.feedback.bad{background:#fff0ef;color:#8c2620}
.matrix-wrap{overflow:auto}.matrix{border-collapse:collapse;margin:16px auto}.matrix th,.matrix td{border:1px solid #fff;text-align:center;min-width:62px;height:52px}.matrix th{background:#f0f2f3;font-size:12px;padding:6px}.matrix td{cursor:pointer;font-weight:bold}.matrix td.low{background:#bfe3c9}.matrix td.med{background:#f4e4a7}.matrix td.high{background:#f4c49e}.matrix td.extreme{background:#e8aaa5}.matrix td.selected{outline:4px solid var(--blue);outline-offset:-4px}.axis{text-align:center;color:var(--muted);font-size:12px;margin:5px}
.control-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.control{border:1px solid var(--line);border-radius:11px;padding:15px}.control.selected{border-color:var(--blue);background:#eef5fb}.control strong{display:block;margin-bottom:5px}.control span{font-size:12px;color:var(--muted)}.control p{font-size:13px;line-height:1.45;margin:8px 0 0}
.result{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center;text-align:center;margin-top:15px}.risk-box{padding:18px;border-radius:12px}.risk-box strong{display:block;font-size:27px}.risk-box small{color:var(--muted)}.arrow{font-size:28px;color:var(--muted)}.low-bg{background:#e5f4e9}.med-bg{background:#fff6d9}.high-bg{background:#fff0df}.extreme-bg{background:#fbe0de}
.finish{text-align:center}.finish h2{margin-top:0}.score-big{font-size:42px;font-weight:bold;color:var(--red)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.summary div{background:var(--soft);padding:14px;border-radius:10px}.summary b{display:block;font-size:20px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.nav{order:2}.options,.control-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
<div class="brand"><h1>Risk Assessment Challenge</h1><p>Identify → Assess → Control → Reassess</p></div>
<div class="stats"><div class="stat"><b id="scenarioNo">1/10</b><small>Scenario</small></div><div class="stat"><b id="score">0</b><small>Score</small></div></div>
</header>
<div class="progress-wrap"><div class="progress"><i id="progress"></i></div></div>
<div class="layout">
<aside class="nav"><h3>Scenarios</h3><div id="scenarioNav"></div></aside>
<main class="main">
<section class="card scenario"><span class="tag" id="scenarioTag"></span><h2 id="scenarioTitle"></h2><p id="scenarioText"></p></section>
<section class="card">
<div class="stage-head"><div><h2 id="stageTitle"></h2><div class="instructions" id="instructions"></div></div><div class="stage-count" id="stageCount"></div></div>
<div id="stageBody"></div><div class="feedback" id="feedback"></div>
<div class="action-row"><button class="btn secondary" id="backBtn" onclick="previousStage()">Back</button><button class="btn primary" id="nextBtn" onclick="nextStage()">Check & Continue</button></div>
</section>
</main></div></div>

<script>
const scenarios=[
{title:"Hot Work Near Hydrocarbons",tag:"Hot Work",text:"A welder is preparing to weld a pipe support near an area where hydrocarbon-containing equipment is operating. The work is planned during normal production.",hazards:["Ignition source from welding","Flammable hydrocarbon vapour","Hot metal and sparks","Inadequate isolation"],risks:["Fire or explosion","Burn injury","Fatality and major asset damage","Uncontrolled release"],initial:[4,5],controls:[["Elimination","Stop or relocate the hot work so welding is not performed near the hydrocarbon source."],["Engineering","Gas testing, continuous gas monitoring and suitable fire protection/fire blanket."],["Administrative","Approved hot-work permit, JSA, area inspection, isolation and dedicated fire watch."],["PPE","FR clothing, welding shield, gloves, safety footwear and eye/face protection."]],residual:[2,5]},
{title:"Confined Space — Mud Tank Cleaning",tag:"Confined Space",text:"Workers must enter a mud tank for cleaning. The tank may contain toxic gas and has restricted entry and exit.",hazards:["Toxic H₂S atmosphere","Oxygen deficiency","Restricted access/egress","Unexpected inflow or energy"],risks:["Poisoning or unconsciousness","Asphyxiation","Difficult emergency escape","Fatality during entry"],initial:[4,5],controls:[["Elimination","Avoid entry where cleaning can be completed using remote or external methods."],["Engineering","Ventilation, isolation/blinding, continuous gas monitoring and suitable rescue equipment."],["Administrative","Confined-space permit, JSA, competent attendant, entry log and rescue plan."],["PPE","SCBA or supplied-air respiratory protection where required, harness and suitable PPE."]],residual:[2,5]},
{title:"Work at Height on Rig Structure",tag:"Work at Height",text:"A worker must access an elevated rig structure to inspect equipment. The work area contains exposed edges and the worker will use a harness.",hazards:["Open edge/fall exposure","Dropped tools or materials","Unstable access","Weather conditions"],risks:["Fall from height","Struck-by injury to persons below","Loss of balance/fall","Serious injury or fatality"],initial:[4,5],controls:[["Elimination","Perform the inspection from ground level or use a remote inspection method where practicable."],["Engineering","Guardrails, proper platforms, toe boards and certified anchorage/SRL."],["Administrative","Work-at-height permit/JSA, inspection of access equipment and exclusion zone below."],["PPE","Full-body harness with suitable connection, helmet with chin strap and safety footwear."]],residual:[2,5]},
{title:"Lifting a Heavy Equipment Component",tag:"Lifting Operation",text:"A crane will lift a heavy equipment component from the ground onto a work platform. Personnel are working around the lifting area.",hazards:["Suspended load","Incorrect rigging","Crane overload or instability","People inside lifting zone"],risks:["Dropped load","Load shift or falling object","Crane overturning","Crush/fatal injury"],initial:[4,5],controls:[["Elimination","Use a lighter modular component or eliminate the lift by installing at ground level where practicable."],["Engineering","Certified crane, lifting accessories, load chart, tag lines and physical exclusion zone."],["Administrative","Lift plan, competent lifting team, pre-use inspection and one-crane/one-permit control."],["PPE","Helmet, safety footwear, gloves, eye protection and other task-specific PPE."]],residual:[2,5]},
{title:"H₂S Exposure During Mud System Work",tag:"H₂S",text:"During mud tank work, agitation of drilling fluid may release H₂S. Personnel are working close to the tank.",hazards:["H₂S release","Poor ventilation","Uncontrolled access to contaminated area","Inadequate gas detection"],risks:["Toxic exposure","Unconsciousness/asphyxiation","Exposure of unprotected personnel","Delayed emergency response"],initial:[4,5],controls:[["Elimination","Stop the activity and remove the source/condition causing H₂S release where practicable."],["Engineering","Fixed/portable gas detection, ventilation and enclosed-system controls where practicable."],["Administrative","H₂S procedure, alarm response, restricted access, trained personnel and emergency drills."],["PPE","Escape respirator/SCBA as required by the site H₂S plan and respiratory protection program."]],residual:[2,5]},
{title:"Electrical Maintenance Without Isolation",tag:"Electrical Safety",text:"An electrician is asked to maintain electrical equipment. The equipment has not yet been positively isolated and verified dead.",hazards:["Live electrical energy","Unexpected energization","Damaged electrical components","Improper test equipment"],risks:["Electric shock","Arc flash/burn","Fatality","Equipment damage/fire"],initial:[4,5],controls:[["Elimination","De-energize and isolate the equipment before work begins."],["Engineering","Lockable isolation point, interlocks and suitable test equipment."],["Administrative","LOTO procedure, authorized person, verification of zero energy and permit/JSA."],["PPE","Arc-rated clothing, insulated gloves and appropriate face/eye protection as required."]],residual:[1,5]},
{title:"Chemical Transfer",tag:"Chemical Handling",text:"A worker transfers a corrosive chemical from a container into a process tank. The transfer hose and connections must be checked before starting.",hazards:["Corrosive chemical","Chemical splash/leak","Incompatible connection","Poor handling/storage"],risks:["Chemical burns","Eye injury and exposure","Uncontrolled release/reaction","Environmental contamination"],initial:[4,4],controls:[["Elimination","Use a less hazardous chemical or eliminate manual transfer where a safer process is feasible."],["Engineering","Closed transfer system, compatible hose/couplings, secondary containment and splash protection."],["Administrative","SDS review, chemical procedure, inspection, labeling and trained personnel."],["PPE","Chemical-resistant gloves, goggles/face shield, protective clothing and safety footwear."]],residual:[2,4]},
{title:"Excavation Near Buried Services",tag:"Excavation",text:"A crew will excavate near an area where underground utilities may be present. The exact service locations are not fully confirmed.",hazards:["Unidentified buried services","Excavation collapse","Mobile plant near excavation","Falling materials"],risks:["Utility strike/electrocution","Burial or crushing","Vehicle/person collision","Serious injury"],initial:[4,5],controls:[["Elimination","Use an alternative route or method that avoids excavation in the service corridor."],["Engineering","Service locating, physical barriers, shoring/sloping and safe access."],["Administrative","Permit to excavate, utility drawings, competent-person inspection and exclusion zone."],["PPE","Helmet, safety footwear, hi-vis clothing, gloves and task-specific protection."]],residual:[2,5]},
{title:"Forklift and Pedestrian Interaction",tag:"Vehicle Safety",text:"A forklift is moving materials through an area also used by pedestrians. The route has limited visibility at an intersection.",hazards:["Forklift movement","Poor visibility","Pedestrian access","Uncontrolled reversing"],risks:["Person struck by vehicle","Collision","Crushing injury","Property damage"],initial:[4,5],controls:[["Elimination","Separate pedestrian and material movement by changing the workflow where practicable."],["Engineering","Physical barriers, designated routes, mirrors, alarms and controlled crossings."],["Administrative","Traffic management plan, speed limits, trained operators and spotter where required."],["PPE","High-visibility clothing, safety footwear and other site-required PPE."]],residual:[2,5]},
{title:"Manual Handling of Heavy Components",tag:"Manual Handling",text:"Workers need to manually move a heavy component over a short distance because mechanical lifting equipment is not immediately available.",hazards:["Heavy/awkward load","Poor lifting posture","Limited space","Unexpected load movement"],risks:["Musculoskeletal injury","Strain/sprain","Hand or foot injury","Dropped component"],initial:[4,3],controls:[["Elimination","Avoid manual handling by changing the task or using mechanical handling equipment."],["Engineering","Use trolley, hoist, lifting aid or other mechanical assistance."],["Administrative","Manual-handling assessment, team lift plan and clear communication."],["PPE","Safety footwear and gloves suitable for the handling task."]],residual:[2,3]}
];

let current=0,stage=1,score=0,completed=Array(10).fill(false);
let selected={hazards:[],risks:[],initial:null,controls:[],residual:null};
const stages=[["Identify Hazards","Select the hazards that are actually present in the scenario."],["Identify Risks","Select the potential harm/consequences arising from those hazards."],["Initial Risk Rating","Rate the risk before applying additional controls."],["Select Control Measures","Choose appropriate controls using the hierarchy of controls."],["Residual Risk Rating","Reassess the risk after the selected controls are implemented."],["Finish","Review the change from initial to residual risk."]];

function riskInfo(n){return n<=4?["LOW","low-bg"]:n<=9?["MEDIUM","med-bg"]:n<=16?["HIGH","high-bg"]:["EXTREME","extreme-bg"]}
function renderNav(){document.getElementById("scenarioNav").innerHTML=scenarios.map((s,i)=>`<button class="scen-btn ${i===current?"active":""} ${completed[i]?"done":""}" onclick="loadScenario(${i})">${i+1}. ${s.title}</button>`).join("")}
function renderScenario(){const s=scenarios[current];document.getElementById("scenarioNo").textContent=`${current+1}/${scenarios.length}`;document.getElementById("scenarioTag").textContent=s.tag;document.getElementById("scenarioTitle").textContent=s.title;document.getElementById("scenarioText").textContent=s.text;document.getElementById("progress").style.width=`${(current/10)*100}%`;renderStage();renderNav()}
function renderStage(){const s=scenarios[current],info=stages[stage-1];document.getElementById("stageTitle").textContent=`Stage ${stage}: ${info[0]}`;document.getElementById("instructions").textContent=info[1];document.getElementById("stageCount").textContent=`${stage} of ${stages.length}`;document.getElementById("backBtn").style.visibility=stage===1?"hidden":"visible";document.getElementById("nextBtn").style.display=stage===6?"inline-block":"inline-block";document.getElementById("nextBtn").textContent=stage===6?(current<9?"Next Scenario":"Finish Game"):"Check & Continue";const body=document.getElementById("stageBody");body.innerHTML="";clearFeedback();if(stage===1)renderMulti(body,s.hazards,selected.hazards,"hazards");if(stage===2)renderMulti(body,s.risks,selected.risks,"risks");if(stage===3)renderMatrix(body,"initial");if(stage===4)renderControls(body,s.controls);if(stage===5)renderMatrix(body,"residual");if(stage===6)renderFinish(body)}
function renderMulti(body,items,chosen,key){const box=document.createElement("div");box.className="options";items.forEach((x,i)=>{const b=document.createElement("button");b.className="option"+(chosen.includes(i)?" selected":"");b.innerHTML=`<b>${x}</b><small>Select if this is relevant to the scenario.</small>`;b.onclick=()=>{const p=chosen.indexOf(i);p>=0?chosen.splice(p,1):chosen.push(i);renderStage()};box.appendChild(b)});body.appendChild(box)}
function renderMatrix(body,key){const table=document.createElement("table");table.className="matrix";let h="<tr><th>Likelihood ↓ / Severity →</th>";for(let c=1;c<=5;c++)h+=`<th>${c}</th>`;h+="</tr>";for(let l=1;l<=5;l++){h+=`<tr><th>${l}</th>`;for(let c=1;c<=5;c++){let n=l*c,cl=n<=4?"low":n<=9?"med":n<=16?"high":"extreme",sel=selected[key]&&selected[key][0]===l&&selected[key][1]===c;h+=`<td class="${cl} ${sel?"selected":""}" onclick="pickRisk('${key}',${l},${c})">${n}</td>`}h+="</tr>"}table.innerHTML=h;body.innerHTML='<div class="axis">Risk Matrix — select Likelihood × Severity</div>';body.appendChild(table);if(selected[key]){let n=selected[key][0]*selected[key][1],ri=riskInfo(n);body.insertAdjacentHTML("beforeend",`<div class="feedback show good">Selected: <b>${selected[key][0]} × ${selected[key][1]} = ${n} (${ri[0]})</b></div>`)}}
function pickRisk(key,l,c){selected[key]=[l,c];renderStage()}
function renderControls(body,controls){const grid=document.createElement("div");grid.className="control-grid";controls.forEach((x,i)=>{const b=document.createElement("div");b.className="control"+(selected.controls.includes(i)?" selected":"");b.innerHTML=`<strong>${i+1}. ${x[0]}</strong><span>Hierarchy of control</span><p>${x[1]}</p>`;b.onclick=()=>{const p=selected.controls.indexOf(i);p>=0?selected.controls.splice(p,1):selected.controls.push(i);renderStage()};grid.appendChild(b)});body.appendChild(grid)}
function renderFinish(body){const a=selected.initial[0]*selected.initial[1],r=selected.residual[0]*selected.residual[1],ai=riskInfo(a),ri=riskInfo(r);body.innerHTML=`<div class="finish"><h2>Assessment Complete</h2><p>You reduced the risk from <b>${a} (${ai[0]})</b> to <b>${r} (${ri[0]})</b>.</p><div class="result"><div class="risk-box ${ai[1]}"><small>INITIAL</small><strong>${a}</strong><b>${ai[0]}</b></div><div class="arrow">→</div><div class="risk-box ${ri[1]}"><small>RESIDUAL</small><strong>${r}</strong><b>${ri[0]}</b></div></div><div class="summary"><div><b>${selected.hazards.length}</b>Hazards selected</div><div><b>${selected.risks.length}</b>Risks selected</div><div><b>${selected.controls.length}</b>Controls selected</div></div></div>`}
function validate(){const s=scenarios[current];if(stage===1){if(selected.hazards.length!==s.hazards.length)return"Select all hazards relevant to this scenario."}if(stage===2){if(selected.risks.length!==s.risks.length)return"Select all relevant risks/consequences."}if(stage===3){if(!selected.initial)return"Select an initial risk rating.";if(selected.initial[0]!==s.initial[0]||selected.initial[1]!==s.initial[1])return`For this scenario, the expected initial rating is ${s.initial[0]} × ${s.initial[1]} = ${s.initial[0]*s.initial[1]}.`}if(stage===4){if(selected.controls.length<2)return"Select at least two control measures.";if(!selected.controls.some(i=>i===0||i===1))return"Include at least one higher-level control: Elimination or Engineering."}if(stage===5){if(!selected.residual)return"Select a residual risk rating.";if(selected.residual[0]!==s.residual[0]||selected.residual[1]!==s.residual[1])return`After controls, the expected residual rating is ${s.residual[0]} × ${s.residual[1]} = ${s.residual[0]*s.residual[1]}.`}return null}
function nextStage(){if(stage===6){completed[current]=true;if(current<9){current++;stage=1;selected={hazards:[],risks:[],initial:null,controls:[],residual:null};score+=100;document.getElementById("score").textContent=score;renderScenario()}else{score+=100;document.getElementById("score").textContent=score;alert("All 10 scenarios completed! Final score: "+score);}}else{const err=validate();if(err){showFeedback(err,false);return}score+=20;document.getElementById("score").textContent=score;stage++;renderStage()}}
function previousStage(){if(stage>1){stage--;renderStage()}}
function showFeedback(msg,good){const f=document.getElementById("feedback");f.textContent=msg;f.className="feedback show "+(good?"good":"bad")}
function clearFeedback(){document.getElementById("feedback").className="feedback"}
function loadScenario(i){current=i;stage=1;selected={hazards:[],risks:[],initial:null,controls:[],residual:null};renderScenario()}
renderScenario();
</script>
</body>
</html>
