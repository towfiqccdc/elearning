<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1a1f2b;
      --muted: #5d6675;
      --border: #d5d9e0;
      --accent: #1f4fd8;
      --accent-hover: #173fb0;
      --error-bg: #fdecec;
      --error-text: #a12626;
      --ok-bg: #e8f5ec;
      --ok-text: #1e6b3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .sub { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      color: inherit;
      background: #fff;
    }
    input:focus-visible, button:focus-visible, .link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button.primary {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .switch { margin: 20px 0 0; text-align: center; font-size: 0.9rem; color: var(--muted); }
    .link {
      background: none;
      border: 0;
      padding: 0;
      color: var(--accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .link:hover { text-decoration: underline; }
    .msg { display: none; margin-bottom: 16px; padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; }
    .msg.error { display: block; background: var(--error-bg); color: var(--error-text); }
    .msg.ok { display: block; background: var(--ok-bg); color: var(--ok-text); }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <main class="card">
    <h1 id="title">Sign in</h1>
    <p class="sub" id="subtitle">Enter your email and password to continue.</p>

    <div id="message" class="msg" role="alert" aria-live="polite"></div>

    <div id="form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" required>

      <button class="primary" id="submit" type="button">Sign in</button>
    </div>

    <p class="switch">
      <span id="switch-text">Don't have an account?</span>
      <button class="link" id="switch-btn" type="button">Sign up</button>
    </p>
  </main>

  <script>
    var mode = "signin"; // "signin" or "signup"

    var titleEl = document.getElementById("title");
    var subtitleEl = document.getElementById("subtitle");
    var emailEl = document.getElementById("email");
    var passwordEl = document.getElementById("password");
    var submitEl = document.getElementById("submit");
    var messageEl = document.getElementById("message");
    var switchTextEl = document.getElementById("switch-text");
    var switchBtnEl = document.getElementById("switch-btn");

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = "msg " + type;
    }
    function clearMessage() {
      messageEl.textContent = "";
      messageEl.className = "msg";
    }

    function setMode(newMode) {
      mode = newMode;
      clearMessage();
      if (mode === "signin") {
        titleEl.textContent = "Sign in";
        subtitleEl.textContent = "Enter your email and password to continue.";
        submitEl.textContent = "Sign in";
        switchTextEl.textContent = "Don't have an account?";
        switchBtnEl.textContent = "Sign up";
        passwordEl.setAttribute("autocomplete", "current-password");
      } else {
        titleEl.textContent = "Create account";
        subtitleEl.textContent = "Use at least 8 characters for your password.";
        submitEl.textContent = "Create account";
        switchTextEl.textContent = "Already have an account?";
        switchBtnEl.textContent = "Sign in";
        passwordEl.setAttribute("autocomplete", "new-password");
      }
    }

    function goHome() {
      location.replace("index.html");
    }

    async function handleSubmit() {
      clearMessage();
      var email = emailEl.value.trim();
      var password = passwordEl.value;

      if (!email || !password) {
        showMessage("Enter your email and password.", "error");
        return;
      }
      if (mode === "signup" && password.length < 8) {
        showMessage("Password must be at least 8 characters.", "error");
        return;
      }

      submitEl.disabled = true;
      try {
        if (mode === "signin") {
          var res = await sb.auth.signInWithPassword({ email: email, password: password });
          if (res.error) throw res.error;
          goHome();
        } else {
          // The confirmation link brings the user back to this page (login.html),
          // which then forwards them to index.html once they are signed in.
          var res2 = await sb.auth.signUp({
            email: email,
            password: password,
            options: { emailRedirectTo: new URL("login.html", location.href).href }
          });
          if (res2.error) throw res2.error;

          // Supabase returns an empty identities list when the email is already registered.
          if (res2.data.user && res2.data.user.identities && res2.data.user.identities.length === 0) {
            showMessage("This email is already registered. Sign in instead.", "error");
          } else if (res2.data.session) {
            goHome();
          } else {
            showMessage("Account created. Check your email and click the confirmation link, then sign in.", "ok");
          }
        }
      } catch (err) {
        var text = err && err.message ? err.message : "Something went wrong. Try again.";
        if (/invalid login credentials/i.test(text)) {
          text = "Incorrect email or password.";
        } else if (/email not confirmed/i.test(text)) {
          text = "Confirm your email first. Check your inbox for the confirmation link.";
        }
        showMessage(text, "error");
      } finally {
        submitEl.disabled = false;
      }
    }

    submitEl.addEventListener("click", handleSubmit);
    switchBtnEl.addEventListener("click", function () {
      setMode(mode === "signin" ? "signup" : "signin");
    });
    [emailEl, passwordEl].forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter") handleSubmit();
      });
    });

    // Explain why the user was signed out automatically.
    var reason = new URLSearchParams(location.search).get("reason");
    if (reason === "idle") {
      showMessage("You were signed out after a period of inactivity. Sign in again to continue.", "error");
    } else if (reason === "expired") {
      showMessage("Your session has ended. Sign in again to continue.", "error");
    }

    // Already logged in (or just arrived from the email confirmation link)? Go to the site.
    sb.auth.getSession().then(function (r) {
      if (r.data.session) goHome();
    });
    sb.auth.onAuthStateChange(function (event, session) {
      if (event === "SIGNED_IN" && session) goHome();
    });
  </script>
</body>
</html>
